<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New Question</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" th:href="@{/css/app.css}">
    <link rel="stylesheet" th:href="@{/css/questions.css}">
</head>
<body>
<main class="container py-4 py-md-5 page-wrap">
    <section class="surface-card p-3 p-md-4">
        <div class="page-header mb-4">
            <div>
                <h1 class="h3 page-title mb-1">Add Question</h1>

            </div>
            <a class="btn btn-outline-secondary" th:href="@{/questions}">Back to Questions</a>
        </div>

        <div class="alert alert-danger mb-3" th:if="${errorMessage}" th:text="${errorMessage}"></div>

        <form th:action="@{/questions}" th:object="${questionForm}" method="post" class="question-form-layout">
            <div class="mb-3">
                <label for="text" class="form-label">Question Text</label>
                <div class="editorjs-shell">
                    <div id="textEditor" class="editorjs-holder" th:attr="data-initial-html=*{text}"></div>
                </div>
                <div class="form-text"></div>
                <div id="textValidationMessage" class="invalid-feedback d-none">Question text is required.</div>
                <textarea id="text" class="visually-hidden" th:field="*{text}"></textarea>
            </div>

            <div class="mb-3">
                <label for="answer" class="form-label">Answer</label>
                <input id="answer" class="form-control" th:field="*{answer}" placeholder="A" required>
            </div>

            <div class="mb-3">
                <label for="tagSearch" class="form-label">Tags</label>
                <div id="tagAutocomplete"
                     class="position-relative"
                     th:attr="data-available-tags=${availableTagsJson},data-initial-tags=*{tagsJson}">
                    <input id="tagSearch"
                           class="form-control"
                           type="text"
                           placeholder="Search tags by key or value, or enter key: value"
                           autocomplete="off">
                    <div id="selectedTags" class="d-flex flex-wrap gap-2 mt-2"></div>
                    <div id="tagSuggestions" class="list-group position-absolute w-100 shadow-sm d-none" style="z-index: 10;"></div>
                </div>
                <div class="form-text">Press Enter to add a new tag in <code>key: value</code> format.</div>
                <textarea id="tagsJson" class="visually-hidden" th:field="*{tagsJson}"></textarea>
            </div>

            <div class="mb-3">
                <div class="d-flex justify-content-between align-items-center gap-3 mb-2">
                    <label class="form-label mb-0" for="optionBuilder">Options</label>
                    <button type="button" class="btn btn-outline-primary btn-sm" id="addOptionButton">Add Option</button>
                </div>
                <div id="optionBuilder" class="option-builder"></div>
                <div id="optionsValidationMessage" class="invalid-feedback d-none">Add at least one option with both label and text.</div>
                <textarea id="optionsJson" class="visually-hidden" th:field="*{optionsJson}"></textarea>
            </div>

            <div class="mb-4">
                <label for="imagesJson" class="form-label">Images JSON</label>
                <textarea id="imagesJson" class="form-control code-input" th:field="*{imagesJson}" rows="6" placeholder='{"images":[{"name":"diagram.png","index":1}]}'></textarea>
            </div>

            <div class="form-actions">
                <button type="submit" class="btn btn-primary">Create Question</button>
            </div>
        </form>
    </section>
</main>
<script src="https://cdn.jsdelivr.net/npm/@editorjs/editorjs@latest"></script>
<script th:src="@{/js/question-form.js}"></script>
</body>
</html>
