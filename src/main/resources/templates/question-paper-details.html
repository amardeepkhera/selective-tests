<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Question Paper Details</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" th:href="@{/css/app.css}">
    <link rel="stylesheet" th:href="@{/css/questions.css}">
</head>
<body>
<main class="container py-4 py-md-5 page-wrap">
    <p class="mb-3"><a class="link-primary" th:href="@{/question-papers}">Back to question papers</a></p>

    <div class="alert alert-warning" th:if="${errorMessage}" th:text="${errorMessage}"></div>

    <section class="surface-card p-3 p-md-4 mb-3" th:if="${questionPaper}">
        <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-start gap-3 mb-3">
            <h1 class="h3 page-title mb-0" th:text="${questionPaper.name}">Question Paper</h1>
            <form th:action="@{/tests/new}" method="post" th:if="${showCreateTestButton}">
                <input type="hidden" name="questionPaperId" th:value="${questionPaperId}">
                <input type="hidden" name="questionCount" th:value="${questionPaper.questions.size()}">
                <button class="btn btn-primary" type="submit">Create Test</button>
            </form>
        </div>

        <dl class="row mb-0">
            <dt class="col-sm-4 detail-key">Tags</dt>
            <dd class="col-sm-8 mb-0">
                <div class="d-flex flex-wrap gap-2" th:if="${!#sets.isEmpty(questionPaper.uniqueTags)}">
                    <span class="badge text-bg-secondary" th:each="tag : ${questionPaper.uniqueTags}" th:text="${tag}"></span>
                </div>
                <span class="text-body-secondary" th:if="${#sets.isEmpty(questionPaper.uniqueTags)}">No tags</span>
            </dd>
        </dl>
    </section>

    <section class="surface-card p-3 p-md-4" th:if="${questionPaper}">
        <h2 class="h5 mb-3">Questions</h2>
        <p class="empty-state mb-0" th:if="${#lists.isEmpty(questionPaper.questions)}">No questions found.</p>

        <div class="table-responsive question-search-results" th:if="${!#lists.isEmpty(questionPaper.questions)}">
            <table class="table data-table questions-table question-paper-results-table mb-0">
                <thead class="table-light">
                <tr>
                    <th scope="col" class="question-number-column">Question No</th>
                    <th scope="col">Question</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="question, questionStat : ${questionPaper.questions}">
                    <td class="question-number-cell" th:text="${questionStat.count}"></td>
                    <td class="question-result-cell">
                        <div class="question-result-layout">
                            <div class="question-result-content">
                                <div class="question-text-full" th:utext="${question.text}"></div>
                            </div>
                        </div>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </section>
</main>
</body>
</html>
