<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Question Paper Details</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" th:href="@{/css/app.css}">
    <link rel="stylesheet" th:href="@{/css/questions.css}">
</head>
<body>
<main class="container py-4 py-md-5 page-wrap">
    <p class="mb-3"><a class="link-primary" th:href="@{/question-papers}">Back to question papers</a></p>

    <div class="alert alert-warning" th:if="${errorMessage}" th:text="${errorMessage}"></div>

    <section class="surface-card p-3 p-md-4" th:if="${questionPaper}">
        <h1 class="h3 page-title mb-3" th:text="${questionPaper.paper.name}">Question Paper</h1>

        <dl class="row mb-0">
            <dt class="col-sm-4 detail-key">Tags</dt>
            <dd class="col-sm-8">
                <code class="code-wrap" th:text="${questionPaper.tags ?: '-'}"></code>
            </dd>

            <dt class="col-sm-4 detail-key">Paper</dt>
            <dd class="col-sm-8">
                <code class="code-wrap" th:text="${questionPaper.paper}"></code>
            </dd>

            <dt class="col-sm-4 detail-key">Created At</dt>
            <dd class="col-sm-8" th:text="${questionPaper.createdAt}"></dd>
        </dl>
    </section>
</main>
</body>
</html>
