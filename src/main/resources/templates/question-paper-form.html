<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New Question Paper</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer">
    <link rel="stylesheet" th:href="@{/css/app.css}">
    <link rel="stylesheet" th:href="@{/css/questions.css}">
</head>
<body>
<main class="container py-4 py-md-5 page-wrap">
    <section class="surface-card p-3 p-md-4">
        <div class="page-header mb-4">
            <div>
                <h1 class="h3 page-title mb-1">Create Question Paper</h1>
            </div>
            <a class="btn btn-outline-secondary" th:href="@{/question-papers}">Back to Question Papers</a>
        </div>

        <div class="alert alert-danger mb-3" th:if="${errorMessage}" th:text="${errorMessage}"></div>
        <div class="alert alert-success mb-3" th:if="${successMessage}" th:text="${successMessage}"></div>

        <div class="question-form-layout mb-4">
            <label for="questionPaperName" class="form-label">Question Paper Name</label>
            <input id="questionPaperName"
                   name="paperName"
                   form="questionPaperWorkflow"
                   class="form-control question-paper-name-input"
                   type="text"
                   placeholder="Enter paper name"
                   th:value="${questionPaperForm.paperName}"
                   aria-label="Enter paper name">
        </div>

        <section class="question-paper-search-panel">
            <div id="questionPaperEditor" class="question-form-layout">
            <div class="mb-4">
                <label for="tagSearch" class="form-label">Search and select from existing tags. Double-click to view all available tags.</label>
                <div id="tagAutocomplete"
                     class="position-relative"
                     th:attr="data-available-tags=${availableTagsJson}">
                    <input id="tagSearch"
                           class="form-control"
                           type="text"
                           placeholder="Search tags by key or value"
                           autocomplete="off">
                    <div id="selectedTags" class="d-flex flex-wrap gap-2 mt-2"></div>
                    <div id="tagSuggestions" class="list-group position-absolute w-100 shadow-sm d-none" style="z-index: 10;"></div>
                </div>
                <textarea id="tagsJson" class="visually-hidden" th:text="${questionPaperForm.tagsJson}"></textarea>
            </div>

            <div class="mb-4">
                <button id="searchQuestionsButton" type="button" class="btn btn-primary">Search Questions</button>
            </div>

            <div id="questionSearchMessage" class="alert d-none" role="status"></div>
            </div>
        </section>

        <form id="questionPaperWorkflow"
              class="question-paper-workflow question-paper-results-panel d-none"
              th:action="@{/question-paper-form/save}"
              method="post"
              aria-label="Question paper actions">
            <div class="question-paper-actions">
                <button id="saveQuestionPaperButton" type="submit" class="btn btn-outline-secondary">Save For Later</button>
                <div id="selectedQuestionCount" class="question-selection-summary">0 question(s) selected</div>
                <button id="nextQuestionPaperButton" type="submit" class="btn btn-primary" th:formaction="@{/question-paper-form/next}">Next</button>
            </div>

            <div id="questionSearchResults" class="table-responsive question-search-results d-none">
                <table class="table data-table questions-table question-paper-results-table mb-0">
                    <thead class="table-light">
                    <tr>
                        <th scope="col" class="question-select-column">
                            <input id="questionSelectAllCheckbox"
                                   class="form-check-input question-header-checkbox"
                                   type="checkbox"
                                   aria-label="Select all questions">
                        </th>
                        <th scope="col">Question</th>
                        <th scope="col" class="question-tags-column">Tags</th>
                    </tr>
                    </thead>
                    <tbody id="questionSearchResultsBody"></tbody>
                </table>
                <div id="questionSearchLoading" class="question-search-status d-none" role="status">Loading more questions...</div>
                <div id="questionSearchEnd" class="question-search-status d-none">All matching questions are loaded.</div>
            </div>
        </form>
    </section>
</main>
<script th:src="@{/js/question-paper-form.js}"></script>
</body>
</html>
