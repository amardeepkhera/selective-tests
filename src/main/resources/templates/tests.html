<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tests</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" th:href="@{/css/app.css}">
    <link rel="stylesheet" th:href="@{/css/tests.css}">
</head>
<body>
<main class="container py-4 py-md-5 page-wrap">
    <section class="surface-card p-3 p-md-4">
        <h1 class="h3 page-title mb-3">Tests</h1>

        <p class="empty-state mb-0" th:if="${#lists.isEmpty(tests)}">No tests found.</p>

        <div class="table-responsive" th:if="${!#lists.isEmpty(tests)}">
            <table class="table table-striped table-hover align-middle data-table mb-0">
                <thead class="table-light">
                <tr>
                    <th scope="col">Name</th>
                    <th scope="col">Subject</th>
                    <th scope="col">Duration (mins)</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="test : ${tests}">
                    <td>
                        <a th:href="@{/tests/{testId}(testId=${test.id})}" th:text="${test.name}"></a>
                    </td>
                    <td th:text="${test.subject}"></td>
                    <td th:text="${test.durationMins}"></td>
                </tr>
                </tbody>
            </table>
        </div>
    </section>
</main>
</body>
</html>
