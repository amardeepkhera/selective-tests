<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Question Paper - Next Step</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" th:href="@{/css/app.css}">
    <link rel="stylesheet" th:href="@{/css/questions.css}">
</head>
<body>
<main class="container py-4 py-md-5 page-wrap">
    <section class="surface-card p-3 p-md-4">
        <div class="page-header mb-4">
            <div>
                <h1 class="h3 page-title mb-1">Create Question Paper</h1>
                <p class="text-body-secondary mb-0">Step 2</p>
            </div>
            <a class="btn btn-outline-secondary" th:href="@{/question-paper-form}">Back</a>
        </div>

        <form th:action="@{/question-paper-form/review}" method="post">
            <section class="question-paper-search-panel">
                <div id="questionPaperTagEditor" class="question-form-layout">
                    <div class="mb-4">
                        <label for="tagSearch" class="form-label">Search and select from existing question paper tags. Double-click to view all available tags.</label>
                        <div id="tagAutocomplete"
                             class="position-relative"
                             th:attr="data-available-tags=${availableTagsJson}">
                            <input id="tagSearch"
                                   class="form-control"
                                   type="text"
                                   placeholder="Search tags by key or value"
                                   autocomplete="off">
                            <div id="selectedTags" class="d-flex flex-wrap gap-2 mt-2"></div>
                            <div id="tagSuggestions" class="list-group position-absolute w-100 shadow-sm d-none" style="z-index: 10;"></div>
                        </div>
                        <textarea id="tagsJson" name="tagsJson" class="visually-hidden" th:text="${questionPaperForm.tagsJson}"></textarea>
                    </div>
                </div>
            </section>

            <div class="form-actions mt-4">
                <button type="submit" class="btn btn-primary">Review</button>
            </div>
        </form>
    </section>
</main>
<script th:src="@{/js/question-paper-form-next.js}"></script>
</body>
</html>
