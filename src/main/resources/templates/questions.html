<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Questions</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" th:href="@{/css/app.css}">
    <link rel="stylesheet" th:href="@{/css/questions.css}">
</head>
<body>
<main class="container py-4 py-md-5 page-wrap">
    <section class="surface-card p-3 p-md-4">
        <div class="page-header mb-3">
            <h1 class="h3 page-title mb-0">Questions</h1>
            <a class="btn btn-primary" th:href="@{/questions/new}">Add Question</a>
        </div>

        <div class="alert alert-success mb-3" th:if="${successMessage}" th:text="${successMessage}"></div>

        <p class="empty-state mb-0" th:if="${#lists.isEmpty(questions)}">No questions found.</p>

        <div class="table-responsive" th:if="${!#lists.isEmpty(questions)}">
            <table class="table table-striped table-hover data-table questions-table mb-0">
                <thead class="table-light">
                <tr>
                    <th scope="col">ID</th>
                    <th scope="col">Text</th>
                    <th scope="col">Image (JSON)</th>
                    <th scope="col">Options (JSON)</th>
                    <th scope="col">Answer</th>
                    <th scope="col">Created At</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="question : ${questions}">
                    <td class="text-break" th:text="${question.id}"></td>
                    <td th:utext="${question.text}"></td>
                    <td><code class="code-wrap" th:text="${question.images}"></code></td>
                    <td><code class="code-wrap" th:text="${question.options}"></code></td>
                    <td th:text="${question.answer}"></td>
                    <td class="text-nowrap" th:text="${question.createdAt}"></td>
                </tr>
                </tbody>
            </table>
        </div>
    </section>
</main>
</body>
</html>
