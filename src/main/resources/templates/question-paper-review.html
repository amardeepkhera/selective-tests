<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Question Paper Review</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" th:href="@{/css/app.css}">
    <link rel="stylesheet" th:href="@{/css/questions.css}">
</head>
<body>
<main class="container py-4 py-md-5 page-wrap">
    <section class="surface-card p-3 p-md-4">
        <div class="page-header mb-4">
            <div>
                <h1 class="h3 page-title mb-1">Review Question Paper</h1>
                <p class="text-body-secondary mb-0">Confirm the assembled paper details before continuing.</p>
            </div>
            <a class="btn btn-outline-secondary" th:href="@{/question-paper-form}">Back</a>
        </div>

        <dl class="row mb-4">
            <dt class="col-sm-3 detail-key">Paper Name</dt>
            <dd class="col-sm-9" th:text="${questionPaperFormState.paperName}"></dd>
            <dt class="col-sm-3 detail-key">Paper Tags</dt>
            <dd class="col-sm-9">
                <div class="d-flex flex-wrap gap-2" th:if="${!#lists.isEmpty(questionPaperTags)}">
                    <span class="badge text-bg-secondary" th:each="tag : ${questionPaperTags}" th:text="${tag}"></span>
                </div>
                <span class="text-body-secondary" th:if="${#lists.isEmpty(questionPaperTags)}">No question paper tags selected.</span>
            </dd>

            <dt class="col-sm-3 detail-key">Question Count</dt>
            <dd class="col-sm-9" th:text="${#lists.size(selectedQuestions)}"></dd>

        </dl>

        <div th:if="${!#lists.isEmpty(selectedQuestions)}">
            <h2 class="h5 mb-3">Selected Question Tags</h2>
            <div class="d-flex flex-wrap gap-2" th:if="${!#lists.isEmpty(selectedQuestionTags)}">
                <span class="badge text-bg-secondary"
                      th:each="tag : ${selectedQuestionTags}"
                      th:text="${tag}"></span>
            </div>
            <p class="text-body-secondary mb-0" th:if="${#lists.isEmpty(selectedQuestionTags)}">Selected questions have no tags.</p>
        </div>

        <p class="empty-state mb-0" th:if="${#lists.isEmpty(selectedQuestions)}">No questions selected.</p>

        <form class="form-actions mt-4" th:action="@{/question-paper-form/submit}" method="post">
            <button type="submit" class="btn btn-primary">Submit</button>
        </form>
    </section>

    <section class="question-paper-results-panel question-paper-review-results-panel w-100 mt-4" th:if="${!#lists.isEmpty(selectedQuestionDetails)}">
        <h2 class="h5 mb-3">Selected Questions</h2>
        <div class="table-responsive question-search-results">
            <table class="table data-table questions-table question-paper-results-table mb-0">
                <thead class="table-light">
                <tr>
                    <th scope="col" class="question-number-column">Question No</th>
                    <th scope="col">Question</th>
                    <th scope="col" class="question-tags-column">Tags</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="question, questionStat : ${selectedQuestionDetails}">
                    <td class="question-number-cell" th:text="${questionStat.count}"></td>
                    <td class="question-result-cell">
                        <div class="question-result-layout">
                            <div class="question-result-content">
                                <div class="question-text-full" th:utext="${question.text}"></div>
                            </div>
                        </div>
                    </td>
                    <td class="question-tags-cell">
                        <div class="question-tags-list d-flex flex-wrap gap-2" th:if="${!#sets.isEmpty(question.tags)}">
                            <span class="badge text-bg-secondary"
                                  th:each="tag : ${question.tags}"
                                  th:text="${tag.key + ': ' + tag.value}"></span>
                        </div>
                        <span class="text-body-secondary" th:if="${#sets.isEmpty(question.tags)}">No tags</span>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </section>
</main>
</body>
</html>
