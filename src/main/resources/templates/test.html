<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Session</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" th:href="@{/css/app.css}">
    <link rel="stylesheet" th:href="@{/css/test.css}">
</head>
<body>
<main class="container py-4 py-md-5 page-wrap">
    <div class="test-layout">
        <section class="surface-card p-3 p-md-4 question-card">
            <div class="question-meta">
                <div class="question-number" th:if="${testState.totalQuestions() > 0}">
                    Question <span th:text="${testState.currentQuestionNo()}">1</span> of <span th:text="${testState.totalQuestions()}">1</span>
                </div>
                <h1 class="question-text mb-0" th:utext="${question != null ? question.text : 'Question text is not available.'}">
                    Question text
                </h1>
            </div>

            <form th:action="@{/test}" method="post" class="question-form" th:if="${testState.totalQuestions() > 0}">
                <input type="hidden" name="currentQuestionNo" th:value="${testState.currentQuestionNo()}">

                <div class="options-list" th:if="${!#lists.isEmpty(question.options.getOptions())}">
                    <label class="option-card" th:each="option : ${question.options.getOptions()}" th:classappend="${selectedAnswer == option.label} ? ' selected'">
                        <input
                            class="form-check-input option-input"
                            type="radio"
                            name="selectedAnswer"
                            th:value="${option.label}"
                            th:checked="${selectedAnswer == option.label}">
                        <span class="option-label" th:text="${option.label}">A</span>
                        <span class="option-text" th:text="${option.text ?: 'Option'}">Option text</span>
                    </label>
                </div>

                <div class="question-nav">
                    <button
                        class="btn btn-outline-primary nav-previous"
                        type="submit"
                        th:formaction="@{/test/previous}"
                        th:disabled="${!testState.hasPrevious()}">
                        Previous
                    </button>
                    <button
                        class="btn btn-success nav-submit"
                        type="submit"
                        th:formaction="@{/test/submit}">
                        Submit Answer
                    </button>
                    <button
                        class="btn btn-primary nav-next"
                        type="submit"
                        th:formaction="@{/test/next}"
                        th:disabled="${!testState.hasNext()}">
                        Next
                    </button>
                </div>
            </form>
        </section>

        <aside class="surface-card p-3 p-md-4 test-side-card">
            <div class="timer-panel">
                <div id="timer-label-id" class="timer-label">Time Remaining</div>
                <div class="timer-value" id="countdownTimer">00:00</div>
            </div>

            <button class="btn btn-danger submit-paper-btn" type="button">Submit Paper</button>
        </aside>
    </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/easytimer.js@4.6.0/dist/easytimer.min.js"></script>
<script th:inline="javascript">
    function enterFullscreen() {
        const elem = document.documentElement;
        if (elem.requestFullscreen) {
            elem.requestFullscreen();
        } else if (elem.webkitRequestFullscreen) {
            elem.webkitRequestFullscreen();
        } else if (elem.msRequestFullscreen) {
            elem.msRequestFullscreen();
        }
    }

    document.getElementById("timer-label-id").addEventListener("click", enterFullscreen);

    const totalDurationSeconds = /*[[${testState.totalDurationInSecs()}]]*/ 0;
    const safeDurationSeconds = Math.max(0, Number(totalDurationSeconds) || 0);
    const timerElement = document.getElementById("countdownTimer");

    const formatValues = (hours, minutes, seconds) => {
        if (hours > 0) {
            return String(hours).padStart(2, "0") + ":" +
                String(minutes).padStart(2, "0") + ":" +
                String(seconds).padStart(2, "0");
        }
        return String(minutes).padStart(2, "0") + ":" + String(seconds).padStart(2, "0");
    };

    if (safeDurationSeconds === 0) {
        timerElement.textContent = "00:00";
    } else {
        const timer = new easytimer.Timer();

        timer.addEventListener("secondsUpdated", function () {
            const t = timer.getTimeValues();
            timerElement.textContent = formatValues(t.hours, t.minutes, t.seconds);
        });
        timer.addEventListener("targetAchieved", function () {
            timerElement.textContent = "00:00";
        });
        timer.start({
            countdown: true,
            startValues: {seconds: safeDurationSeconds}
        });
        const initial = timer.getTimeValues();
        timerElement.textContent = formatValues(initial.hours, initial.minutes, initial.seconds);
    }
</script>
</body>
</html>
