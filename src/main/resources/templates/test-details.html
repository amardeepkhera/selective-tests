<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Details</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" th:href="@{/css/app.css}">
    <link rel="stylesheet" th:href="@{/css/test-details.css}">
</head>
<body>
<main class="container py-4 py-md-5 page-wrap">
    <p class="mb-3"><a class="link-primary" th:href="@{/tests}">Back to tests</a></p>

    <div class="alert alert-warning" th:if="${errorMessage}" th:text="${errorMessage}"></div>

    <section class="surface-card p-3 p-md-4" th:if="${test}">

        <dl class="row mb-0">
            <dt class="col-sm-4 detail-key">Test Name</dt>
            <dd class="col-sm-8 text-break" th:text="${test.name}"></dd>

            <dt class="col-sm-4 detail-key">Subject</dt>
            <dd class="col-sm-8" th:text="${test.subject}"></dd>

            <dt class="col-sm-4 detail-key">Duration</dt>
            <dd class="col-sm-8"><span th:text="${test.durationMins}"></span> minutes</dd>

            <dt class="col-sm-4 detail-key">Instructions</dt>
            <dd class="col-sm-8" th:if="${#strings.isEmpty(test.instructions)}">N/A</dd>
            <dd class="col-sm-8" th:if="${!#strings.isEmpty(test.instructions)}" th:utext="${test.instructions}"></dd>

            <dt class="col-sm-4 detail-key">Question Paper</dt>
            <dd class="col-sm-8 text-break">
                <a th:href="@{/question-papers/{questionPaperId}(questionPaperId=${test.questionPaperId})}"
                   th:text="${test.questionPaperName}">Question Paper</a>
            </dd>
        </dl>

        <form class="mt-3" th:action="@{/tests/{testId}(testId=${test.id})}" method="post">
            <button class="btn btn-primary" type="submit">Start Test</button>
        </form>
    </section>
</main>
</body>
</html>
