<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New Test</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer">
    <link rel="stylesheet" th:href="@{/css/app.css}">
    <link rel="stylesheet" th:href="@{/css/questions.css}">
</head>
<body>
<main class="container py-4 py-md-5 page-wrap">
    <section class="surface-card p-3 p-md-4">
        <div class="page-header mb-4">
            <div>
                <h1 class="h3 page-title mb-1">Create Test</h1>
            </div>
            <a class="btn btn-outline-secondary" th:href="@{/question-papers/{questionPaperId}(questionPaperId=${questionPaperId})}">Back to Question Paper</a>
        </div>

        <div class="alert alert-danger mb-3" th:if="${errorMessage}" th:text="${errorMessage}"></div>
        <div class="alert alert-success mb-3" th:if="${successMessage}" th:text="${successMessage}"></div>

        <form id="testPaperWorkflow" th:action="@{/tests}" method="post">
            <input type="hidden" name="questionPaperId" th:value="${questionPaperId}">

            <div class="question-form-layout mb-4">
                <div class="mb-3">
                    <label for="testName" class="form-label">Test Name</label>
                    <input id="testName"
                           name="name"
                           class="form-control question-paper-name-input"
                           type="text"
                           placeholder="Enter test name"
                           th:value="${testForm.name}"
                           aria-label="Enter test name">
                </div>

                <div class="mb-3">
                    <label for="testSubject" class="form-label">Subject</label>
                    <select id="testSubject"
                            name="subjectId"
                            class="form-select"
                            aria-label="Select subject"
                            required>
                        <option value="" th:if="${#lists.isEmpty(subjects)}" selected>No subjects available</option>
                        <option value="" th:if="${!#lists.isEmpty(subjects)}" disabled>Select subject</option>
                        <option th:each="subject : ${subjects}"
                                th:value="${subject.id}"
                                th:text="${subject.name}"
                                th:selected="${testForm.subjectId == subject.id}"></option>
                    </select>
                </div>

                <div class="mb-3">
                    <label for="testDuration" class="form-label">Duration (mins)</label>
                    <input id="testDuration"
                           name="durationMins"
                           class="form-control"
                           type="number"
                           min="1"
                           placeholder="Enter duration in minutes"
                           th:value="${testForm.durationMins}"
                           aria-label="Enter duration in minutes">
                </div>

                <div class="mb-0">
                    <p class="mb-0">Total Questions: <span class="fw-bold" th:text="${testForm.questionCount}">0</span></p>
                </div>
            </div>

            <section class="question-paper-search-panel">
                <div class="question-form-layout">
                    <div class="mb-4">
                        <label for="testInstructions" class="form-label">Instructions</label>
                        <div class="editorjs-shell">
                            <div id="testInstructionsEditor" class="editorjs-holder" th:attr="data-initial-html=${testForm.instructions}"></div>
                        </div>
                        <textarea id="testInstructions"
                                  name="instructions"
                                  class="visually-hidden"
                                  th:text="${testForm.instructions}"></textarea>
                    </div>
                </div>
            </section>

            <div class="question-paper-actions mt-4">
                <button type="submit" class="btn btn-primary" th:disabled="${#lists.isEmpty(subjects)}">Create Test</button>
            </div>
        </form>
    </section>
</main>
<script src="https://cdn.jsdelivr.net/npm/@editorjs/editorjs@latest"></script>
<script src="https://cdn.jsdelivr.net/npm/@editorjs/list@latest"></script>
<script th:src="@{/js/test-paper-form.js}"></script>
</body>
</html>
